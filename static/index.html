<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.conflict{border-left:4px solid #b54; padding-left:10px;margin:8px 0;background:#fbf3f2}</style><h1>数字人文文本校勘</h1>
<section><button onclick="state()">刷新状态</button><pre id="state"></pre></section>
<section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section>
<section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section>
<section><h2>断网待合并批次</h2><div class="grid">
<input id="batchId" placeholder="批次号（断网本地生成）"><input id="opId" placeholder="操作号"><input id="clientKey" placeholder="离线异文键（新建用）">
<select id="opType"><option value="create_variant">新建异文</option><option value="update_variant">修订异文</option><option value="update_alignment">修订对齐</option></select>
<input id="baseRevision" type="number" value="0" placeholder="基准修订"><input id="station" placeholder="工作站标识">
<textarea id="opProposed" placeholder="字段 proposed_text / aligned_text"></textarea><textarea id="opReason" placeholder="字段 reason"></textarea>
</div>
<button onclick="enqueue(false)">入队暂不合并</button>
<button onclick="enqueue(true)">联网提交并合并</button>
<button onclick="batches()">看待处理批次</button>
<button onclick="conflicts()">看待裁决冲突</button>
<pre id="sync"></pre></section>
<section><h2>负责人裁决</h2><input id="conflictId" type="number" placeholder="冲突 ID"><input id="candidateId" type="number" placeholder="胜出候选 ID"><input id="customValue" placeholder="或直接填写裁决值">
<button onclick="resolvePick()">采用候选</button><button onclick="resolveCustom()">采用自填值</button><pre id="verdict"></pre></section>
<script>
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});show(e,await r.json());return r.status}
async function state(){show('#state',await(await fetch('/api/state')).json())}
function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}
function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}
function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}
function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}
function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}
function buildOp(){const fields={};if(opProposed.value.trim())fields[opType.value==='update_alignment'?'aligned_text':'proposed_text']=opProposed.value;if(opReason.value.trim()&&opType.value!=='update_alignment')fields.reason=opReason.value;
const op={op_id:opId.value,op_type:opType.value,witness_id:+witness.value,author_id:+user.value,base_revision:+baseRevision.value,station:station.value,fields};
if(opType.value==='update_variant')op.variant_id=+variant.value;if(opType.value==='create_variant')op.client_key=clientKey.value;return op}
function enqueue(merge){post('/api/passages/'+passage.value+'/sync',{user_id:+user.value,batch_id:batchId.value,auto_merge:merge,operations:[buildOp()]},'#sync')}
async function batches(){get('/api/passages/'+passage.value+'/sync-batches?user_id='+user.value,'#sync')}
async function conflicts(){get('/api/passages/'+passage.value+'/conflicts?user_id='+user.value,'#sync')}
async function retry(id){post('/api/sync-batches/'+id+'/retry',{user_id:+user.value},'#sync')}
function resolvePick(){post('/api/conflicts/'+conflictId.value+'/resolve',{user_id:+user.value,winning_candidate_id:+candidateId.value},'#verdict')}
function resolveCustom(){post('/api/conflicts/'+conflictId.value+'/resolve',{user_id:+user.value,custom_value:customValue.value},'#verdict')}
state()
</script></html>
